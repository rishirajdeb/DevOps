name: Fabric CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.fabric/**'
      
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checking out repo for the GitHub Action Runner
      - name: Checkout repo
        uses: actions/checkout@v4
      
      # Authentication
      - name: Get Access Token
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://api.fabric.microsoft.com/.default" \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token")

          ACCESS_TOKEN=$(echo $RESPONSE | jq -r '.access_token')

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      # Deployment
      - name: Trigger Fabric Git Sync (Auto Apply)
        run: |
          curl -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${{secrets.WORKSPACE_ID}}/git/updateFromGit" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"conflictResolution\":{\"conflictResolutionType\":\"Workspace\"}}"
