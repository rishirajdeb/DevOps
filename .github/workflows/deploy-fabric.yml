
name: Fabric CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '.fabric/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get Access Token
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://api.fabric.microsoft.com/.default" \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Get Git Status
        run: |
          curl -s -X GET \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json"

      - name: Update From Git
        run: |
          STATUS=$(curl -s -X GET \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.WORKSPACE_ID }}/git/status" \
            -H "Authorization: Bearer $ACCESS_TOKEN")

          REMOTE_HASH=$(echo "$STATUS" | jq -r '.remoteCommitHash')
          WORKSPACE_HASH=$(echo "$STATUS" | jq -r '.workspaceHead')

          curl -i -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.WORKSPACE_ID }}/git/updateFromGit" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"remoteCommitHash\": \"$REMOTE_HASH\",
              \"workspaceHead\": \"$WORKSPACE_HASH\",
              \"conflictResolution\": {
                \"conflictResolutionType\": \"Workspace\",
                \"conflictResolutionPolicy\": \"PreferWorkspace\"
              }
            }"
